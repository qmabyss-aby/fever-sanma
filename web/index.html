<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>フィーバー三麻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>フィーバー三麻</h1>
    <label>対戦相手
      <select id="ai">
        <option value="any">ランダム（2種を選ぶ）</option>
        <option value="strong">強いCPU ×2</option>
        <option value="value">高打点狙い ×2</option>
        <option value="sekizui">脊髄狙い ×2</option>
        <option value="defense">守備型 ×2</option>
      </select>
    </label>
    <label>速さ
      <select id="speed">
        <option value="900">ゆっくり</option>
        <option value="450" selected>ふつう</option>
        <option value="150">はやい</option>
      </select>
    </label>
    <button id="new-match" type="button">新しい対局</button>
    <button id="show-ranking" type="button" hidden>ランキング</button>
  </header>

  <main id="table" hidden>
    <div id="info" class="info"></div>
    <div id="banner" class="banner"></div>
    <div id="opponents" class="opponents"></div>
    <pre id="log" class="log"></pre>
    <div id="self" class="panel self"></div>
    <div id="prompt" class="prompt"></div>
    <div id="buttons" class="buttons"></div>
  </main>

  <div id="loading" class="loading">
    <p id="loading-text">読み込み中…（初回は十数秒かかります）</p>
  </div>

  <div id="dialog" class="overlay" hidden>
    <div class="dialog">
      <h2 id="dialog-title"></h2>
      <pre id="dialog-text"></pre>
      <div id="dialog-extra"></div>
      <div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>

  <div id="ranking" class="overlay" hidden>
    <div class="dialog">
      <h2>ランキング</h2>
      <div id="ranking-tabs" class="ranking-tabs"></div>
      <div id="ranking-body"></div>
      <div class="dialog-buttons"><button id="ranking-close" type="button">閉じる</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="config.js"></script>
  <script src="ranking.js"></script>
  <script src="app.js"></script>
</body>
</html>
