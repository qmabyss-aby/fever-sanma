[project]
name = "fever-sanma"
version = "0.1.0"
description = "フィーバー三麻（ローカルルール三人麻雀）"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fever_sanma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
